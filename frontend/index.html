<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EchoRoom AI — a premium music event discovery and promotion platform." />
    <title>EchoRoom AI</title>
  </head>
  <body>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('echoroom-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = storedTheme || (systemDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
